<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BouMatic — Project Management</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--ac:#0891b2;--al:#ecfeff;--ad:#164e63;--gr:#16a34a;--gl:#dcfce7;--am:#d97706;--aml:#fef3c7;--rd:#dc2626;--rl:#fee2e2;--pu:#7c3aed;--pul:#f5f3ff;--bdr:#e5e7eb;--pg:#f9fafb;--pg2:#f3f4f6;--tx:#111827;--t2:#6b7280;--t3:#9ca3af;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--pg);color:var(--tx);font-size:13px}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#083344,#0891b2);padding:20px}
.lc{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ll{font-size:20px;font-weight:700;color:var(--ac);margin-bottom:2px}
.ls{font-size:12px;color:var(--t2);margin-bottom:24px}
.fr{margin-bottom:12px}.fr label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px;text-transform:uppercase}
.fi{width:100%;padding:9px 11px;border:1.5px solid #d1d5db;border-radius:var(--r);font-family:inherit;font-size:13px}
.fi:focus{outline:none;border-color:var(--ac)}
.bl{width:100%;padding:11px;background:var(--ac);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.bl:hover{background:var(--ad)}
.lerr{color:#dc2626;font-size:12px;margin-top:8px;text-align:center;display:none}
.hint{font-size:11px;color:var(--t3);text-align:center;margin-top:10px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:224px;min-width:224px;background:#083344;display:flex;flex-direction:column;overflow-y:auto}
.sbr{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sbn{font-size:13px;font-weight:700;color:#fff}.sbs{font-size:10px;color:rgba(255,255,255,.4)}
.sup{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sav{width:28px;height:28px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sun{font-size:12px;font-weight:500;color:#fff}.sur{font-size:10px;color:rgba(255,255,255,.4)}
.nsc{padding:9px 14px 2px;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.06em}
.ni{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:rgba(255,255,255,.58);font-size:12px;border-left:3px solid transparent;transition:all .1s}
.ni:hover{background:rgba(255,255,255,.07);color:#fff}
.ni.active{background:rgba(8,145,178,.35);color:#fff;border-left-color:var(--ac)}
.ni i{font-size:15px;flex-shrink:0}
.lo{margin:auto 12px 12px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:var(--r);background:transparent;color:rgba(255,255,255,.6);font-family:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:6px}
.lo:hover{background:rgba(255,255,255,.1);color:#fff}
.mn{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;align-items:center;gap:10px;padding:11px 20px;border-bottom:1px solid var(--bdr);background:#fff;position:sticky;top:0;z-index:5;flex-shrink:0}
.tb-m{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2)}
.tb h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{padding:16px 20px;flex:1}
.sc{display:none}.sc.active{display:block}
/* components */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:11px 13px}
.sl{font-size:11px;color:var(--t2);margin-bottom:2px;font-weight:500}.sv{font-size:21px;font-weight:700}
.cd{background:#fff;border:1px solid var(--bdr);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--bdr);gap:8px;flex-wrap:wrap}
.cht{font-size:13px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--t2);font-weight:500;font-size:11px;padding:7px 10px;border-bottom:1px solid var(--bdr);background:var(--pg);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--bdr);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--pg)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:var(--r);border:1px solid #d1d5db;background:#fff;color:var(--tx);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:500;transition:all .1s}
.btn:hover{background:var(--pg)}
.bp{background:var(--ac);color:#fff;border-color:var(--ac)}.bp:hover{background:var(--ad)}
.bg_{background:var(--gl);color:#166534;border-color:#86efac}
.br_{color:#991b1b;border-color:#fca5a5}.br_:hover{background:var(--rl)}
.bsm{padding:3px 9px;font-size:11px}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.dg{background:var(--gl);color:#166534}.da{background:var(--aml);color:#92400e}
.dr{background:var(--rl);color:#991b1b}.db{background:#dbeafe;color:#1e40af}
.dgr{background:var(--pg2);color:#374151}.dpu{background:var(--pul);color:#5b21b6}
.dc_{background:#ecfeff;color:#0e7490}
input,select,textarea{font-family:'Inter',sans-serif;font-size:13px;padding:7px 10px;border:1px solid #d1d5db;border-radius:var(--r);background:#fff;color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(8,145,178,.1)}
textarea{resize:vertical;min-height:60px}
.fg{margin-bottom:10px}.fg label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:3px;text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.ov.open{display:flex}
.mo{background:#fff;border-radius:14px;border:1px solid var(--bdr);padding:22px;width:100%;max-width:540px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.molg{max-width:720px}
.mt2{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.cx{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3);padding:0}.cx:hover{color:var(--tx)}
.emp{text-align:center;padding:24px;color:var(--t3);font-size:12px}
.pb{height:6px;background:var(--pg2);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px}
.sbb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:49}
.sbb.open{display:block}
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:12px}
.tab{padding:6px 13px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx)}.tab.active{color:var(--ac);border-bottom-color:var(--ac)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:9px;width:24px;height:24px}
/* project detail */
.ms-section{margin-bottom:14px;border-radius:8px;overflow:hidden;border:1px solid var(--bdr)}
.ms-sec-hdr{padding:7px 12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.type-dev .ms-sec-hdr{background:#eff6ff;color:#1d4ed8;border-bottom:1px solid #bfdbfe}
.type-mgmt .ms-sec-hdr{background:#fefce8;color:#854d0e;border-bottom:1px solid #fde68a}
.type-test .ms-sec-hdr{background:#f0fdf4;color:#15803d;border-bottom:1px solid #86efac}
.type-design .ms-sec-hdr{background:#fdf4ff;color:#86198f;border-bottom:1px solid #e879f9}
.type-deploy .ms-sec-hdr{background:#fff7ed;color:#c2410c;border-bottom:1px solid #fdba74}
.type-analysis .ms-sec-hdr{background:#f0f9ff;color:#0e7490;border-bottom:1px solid #67e8f9}
/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-hdr{text-align:center;font-size:10px;font-weight:600;color:var(--t2);padding:4px 0}
.cal-day{min-height:56px;background:#fff;border:1px solid var(--bdr);border-radius:4px;padding:3px;font-size:10px;position:relative}
.cal-day.today{border-color:var(--ac);background:var(--al)}
.cal-day.empty{background:var(--pg2);border-color:transparent}
.cal-dn{font-size:10px;font-weight:600;color:var(--t2);margin-bottom:2px}
.cal-ev{border-radius:3px;padding:1px 4px;font-size:9px;font-weight:500;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* perf */
.perf-bar{height:8px;background:var(--pg2);border-radius:4px;overflow:hidden;flex:1}
.perf-fill{height:100%;border-radius:4px}
/* training timeline */
.tr-item{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--bdr)}
.tr-item:last-child{border-bottom:none}
.tr-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
@media(max-width:768px){
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}.tb-m{display:block}
  .sts{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
  .ct{padding:12px}.ov{padding:10px}.mo{max-width:100%}
}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="lw" id="login-screen">
<div class="lc">
  <div class="ll"><i class="ti ti-layout-kanban"></i> Project Management</div>
  <div class="ls">BouMatic — CS & PMO</div>
  <div class="fr"><label>Username</label><input class="fi" id="l-user" placeholder="e.g. arsalan.m"></div>
  <div class="fr"><label>PIN</label><input class="fi" id="l-pin" type="password" placeholder="PIN" maxlength="6"></div>
  <div class="lerr" id="l-err"><i class="ti ti-alert-circle"></i> Invalid credentials</div>
  <button class="bl" onclick="doLogin()"><i class="ti ti-login"></i> Sign in</button>
  <div class="hint">Admin: arsalan.m / 100001</div>
</div>
</div>
<!-- APP -->
<div class="app" id="app-screen" style="display:none">
<div class="sb" id="sidebar">
  <div class="sbr"><div class="sbn"><i class="ti ti-layout-kanban"></i> Project Mgmt</div><div class="sbs">BouMatic</div></div>
  <div class="sup"><div class="sav" id="sb-av">?</div><div><div class="sun" id="sb-name">—</div><div class="sur" id="sb-role">—</div></div></div>
  <div id="nav-links"></div>
  <button class="lo" onclick="logout()"><i class="ti ti-logout"></i> Sign out</button>
</div>
<div class="sbb" id="sb-bg" onclick="closeSb()"></div>
<div class="mn">
  <div class="tb">
    <button class="tb-m" onclick="toggleSb()"><i class="ti ti-menu-2"></i></button>
    <h1 id="pg-title">Dashboard</h1>
    <div id="tb-acts" style="display:flex;gap:6px;flex-shrink:0"></div>
  </div>
  <div class="ct">
    <div id="s-dash" class="sc active"></div>
    <div id="s-pipeline" class="sc"></div>
    <div id="s-projects" class="sc"></div>
    <div id="s-detail" class="sc"></div>
    <div id="s-tasks" class="sc"></div>
    <div id="s-leave" class="sc"></div>
    <div id="s-training" class="sc"></div>
    <div id="s-perf" class="sc"></div>
  </div>
</div>
</div>
<!-- MODALS -->
<div id="m-add-proj" class="ov"><div class="mo molg">
  <div class="mt2">New project<button class="cx" onclick="closeMo('m-add-proj')">×</button></div>
  <div class="g2">
    <div class="fg"><label>Project name</label><input id="pj-name"></div>
    <div class="fg"><label>Department</label><select id="pj-dept"></select></div>
  </div>
  <div class="g3">
    <div class="fg"><label>Owner</label><select id="pj-owner"></select></div>
    <div class="fg"><label>Start date</label><input type="date" id="pj-start"></div>
    <div class="fg"><label>Target finish</label><input type="date" id="pj-end"></div>
  </div>
  <div class="g2">
    <div class="fg"><label>Priority</label><select id="pj-prio"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
    <div class="fg"><label>Status</label><select id="pj-status"><option>Planning</option><option selected>Active</option><option>On hold</option><option>Done</option></select></div>
  </div>
  <div class="fg"><label>Description</label><textarea id="pj-desc"></textarea></div>
  <button class="btn bp" style="width:100%;margin-top:4px" onclick="addProject()"><i class="ti ti-check"></i>Create project</button>
</div></div>
<div id="m-pl" class="ov"><div class="mo molg">
  <div class="mt2" id="m-pl-title">Pipeline item<button class="cx" onclick="closeMo('m-pl')">×</button></div>
  <div class="fg"><label>Task</label><input id="pl-task" placeholder="What needs to be done?"></div>
  <div class="g2">
    <div class="fg"><label>Assigned to</label><select id="pl-resp"></select></div>
    <div class="fg"><label>Link to project</label><select id="pl-proj"><option value="">— No project —</option></select></div>
  </div>
  <div class="g3">
    <div class="fg"><label>Priority</label><select id="pl-prio"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
    <div class="fg"><label>Due date</label><input type="date" id="pl-due"></div>
    <div class="fg"><label>Status</label><select id="pl-status">
      <option value="tbs">To Be Started</option>
      <option value="doing">In Progress</option>
      <option value="done">Done</option>
      <option value="blocked">Blocked</option>
    </select></div>
  </div>
  <div class="fg"><label>Next steps</label><textarea id="pl-next" style="min-height:48px"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn bp" style="flex:1" onclick="savePl()"><i class="ti ti-check"></i>Save</button>
    <button class="btn br_" id="pl-del-btn" onclick="deletePl()"><i class="ti ti-trash"></i></button>
  </div>
</div></div>
<div id="m-add-ms" class="ov"><div class="mo molg">
  <div class="mt2" id="m-ms-title">Milestone<button class="cx" onclick="closeMo('m-add-ms')">×</button></div>
  <div class="fg"><label>Title</label><input id="ms-name"></div>
  <div class="g2">
    <div class="fg"><label>Type</label><select id="ms-type">
      <option value="Development">🔵 Development</option><option value="Management">🟡 Management</option>
      <option value="Testing">🟢 Testing</option><option value="Design">🟣 Design</option>
      <option value="Deployment">🟠 Deployment</option><option value="Analysis">🔷 Analysis</option>
    </select></div>
    <div class="fg"><label>Responsible</label><select id="ms-resp"></select></div>
  </div>
  <div class="g3">
    <div class="fg"><label>Start</label><input type="date" id="ms-start"></div>
    <div class="fg"><label>Due date</label><input type="date" id="ms-end"></div>
    <div class="fg"><label>Priority</label><select id="ms-prio"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
  </div>
  <div class="g2">
    <div class="fg"><label>Status</label><select id="ms-status">
      <option value="tbs">To Be Started</option><option value="doing">In Progress</option><option value="done">Done</option>
    </select></div>
    <div class="fg"><label>% Complete</label><input type="range" id="ms-pct" min="0" max="100" step="5" oninput="document.getElementById('ms-pct-lbl').textContent=this.value+'%'">
    <span id="ms-pct-lbl" style="font-size:11px;color:var(--t2)">0%</span></div>
  </div>
  <div class="fg"><label>Notes</label><textarea id="ms-notes" style="min-height:48px"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn bp" style="flex:1" onclick="saveMs()"><i class="ti ti-check"></i>Save</button>
    <button class="btn br_" id="ms-del-btn" onclick="deleteMs()"><i class="ti ti-trash"></i></button>
  </div>
</div></div>
<div id="m-leave" class="ov"><div class="mo">
  <div class="mt2" id="m-leave-title">Leave request<button class="cx" onclick="closeMo('m-leave')">×</button></div>
  <div class="g2">
    <div class="fg"><label>Agent</label><select id="lv-agent"></select></div>
    <div class="fg"><label>Type</label><select id="lv-type"><option>Annual</option><option>Sick</option><option>Emergency</option><option>Special</option><option>Training</option></select></div>
  </div>
  <div class="g2">
    <div class="fg"><label>From</label><input type="date" id="lv-from"></div>
    <div class="fg"><label>To</label><input type="date" id="lv-to"></div>
  </div>
  <div class="fg"><label>Notes</label><textarea id="lv-notes" style="min-height:48px"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn bp" style="flex:1" onclick="saveLv()"><i class="ti ti-check"></i>Save</button>
    <button class="btn br_" id="lv-del-btn" onclick="deleteLv()"><i class="ti ti-trash"></i></button>
  </div>
</div></div>
<div id="m-train" class="ov"><div class="mo">
  <div class="mt2" id="m-train-title">Training entry<button class="cx" onclick="closeMo('m-train')">×</button></div>
  <div class="g2">
    <div class="fg"><label>Agent</label><select id="tr-agent"></select></div>
    <div class="fg"><label>Skill / Topic</label><input id="tr-topic" placeholder="e.g. Robot order entry"></div>
  </div>
  <div class="g3">
    <div class="fg"><label>Date</label><input type="date" id="tr-date"></div>
    <div class="fg"><label>Duration</label><input id="tr-dur" placeholder="e.g. 2h"></div>
    <div class="fg"><label>Status</label><select id="tr-status"><option value="planned">Planned</option><option value="done">Completed</option></select></div>
  </div>
  <div class="fg"><label>Trainer / Notes</label><input id="tr-notes" placeholder="Who trains them?"></div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn bp" style="flex:1" onclick="saveTr()"><i class="ti ti-check"></i>Save</button>
    <button class="btn br_" id="tr-del-btn" onclick="deleteTr()"><i class="ti ti-trash"></i></button>
  </div>
</div></div>

// ═══ HELPERS ═══
function usr(id){return USERS.find(function(u){return u.id===id;})||{name:'?',dept:'',region:''};}
function proj(id){return projects.find(function(p){return p.id===id;});}
function today(){return new Date().toISOString().slice(0,10);}
function av(name){return(name||'?').split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function avH(uid,size){
  size=size||24;
  var u=usr(uid);
  var c=DC[u.dept]||'#4f46e5';
  var bg=DB[u.dept]||'#eef0fe';
  return '<span class="av" style="background:'+bg+';color:'+c+';width:'+size+'px;height:'+size+'px;font-size:'+(size<26?9:11)+'px">'+av(u.name)+'</span>';
}
function prioBdg(p){
  var m={High:'dr',Medium:'da',Low:'dg',Urgent:'dr'};
  return '<span class="bdg '+(m[p]||'dgr')+'">'+(p||'—')+'</span>';
}
function stsBdg(s){
  if(s==='done') return '<span class="bdg dg">Done</span>';
  if(s==='doing') return '<span class="bdg db">In Progress</span>';
  if(s==='tbs') return '<span class="bdg dgr">To Be Started</span>';
  if(s==='blocked') return '<span class="bdg dr">Blocked</span>';
  if(s==='Active') return '<span class="bdg dg">Active</span>';
  if(s==='Planning') return '<span class="bdg dgr">Planning</span>';
  if(s==='On hold') return '<span class="bdg da">On hold</span>';
  return '<span class="bdg dgr">'+(s||'')+'</span>';
}
function deptBdg(d){
  var c=DC[d]||'#374151';
  var bg=DB[d]||'#f9fafb';
  return '<span class="bdg" style="background:'+bg+';color:'+c+'">'+d+'</span>';
}
function calcPct(p){
  var ms=p.milestones||[];
  if(!ms.length) return 0;
  return Math.round(ms.reduce(function(s,m){return s+(m.pct||0);},0)/ms.length);
}
function isAdmin(){return currentUser&&currentUser.role==='admin';}
function ratingColor(r){return r==='Exceeds'?'#166534':r==='Meets'?'#1d4ed8':'#92400e';}

function doLogin(){
  var uname=document.getElementById('l-user').value.trim().toLowerCase();
  var pin=document.getElementById('l-pin').value.trim();
  var user=USERS.find(function(x){return x.username===uname&&x.pin===pin;});
  if(!user){document.getElementById('l-err').style.display='block';return;}
  document.getElementById('l-err').style.display='none';
  currentUser=user;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  buildSb();navTo('dash');
}
document.getElementById('l-pin').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
function logout(){
  currentUser=null;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  ['l-user','l-pin'].forEach(function(id){document.getElementById(id).value='';});
}

      +'<td style="font-weight:500;color:'+(od?'#dc2626':'var(--tx)')+';white-space:nowrap">'+(pl.due||'—')+(od?' ⚠':'')+'</td>'
      +'<td>'+stsBdg(pl.status)+'</td>'

  var firstDay=new Date(year,month,1).getDay();
  var daysInMonth=new Date(year,month+1,0).getDate();
  var todayStr=today();
  // cells
  var cells=[];
  for(var i=0;i<(firstDay===0?6:firstDay-1);i++) cells.push(null);
  for(var d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  var calCells='';
  cells.forEach(function(d){
    if(!d){calCells+='<div class="cal-day empty"></div>';return;}
    var mm=String(month+1).padStart(2,'0');
    var dd=String(d).padStart(2,'0');
    var dateStr=year+'-'+mm+'-'+dd;
    var events=leaves.filter(function(l){return l.from<=dateStr&&l.to>=dateStr&&l.status!=='Declined';});
    var isToday=dateStr===todayStr;
    var evHtml='';
    events.forEach(function(l){
      var u=usr(l.agent);
      evHtml+='<div class="cal-ev" style="background:'+(LV_BG[l.type]||'#f3f4f6')+';color:'+(LV_COLORS[l.type]||'#374151')+'">'+u.name.split(' ')[0]+'</div>';
    });
    calCells+='<div class="cal-day'+(isToday?' today':'')+'"><div class="cal-dn">'+d+'</div>'+evHtml+'</div>';
  });
  var legendHtml='';
  Object.keys(LV_COLORS).forEach(function(type){
    legendHtml+='<span style="display:flex;align-items:center;gap:4px;font-size:11px"><span style="width:10px;height:10px;border-radius:50%;background:'+(LV_BG[type]||'#f3f4f6')+';border:1.5px solid '+(LV_COLORS[type]||'#374151')+';display:inline-block"></span>'+type+'</span>';
  });
  var pending=leaves.filter(function(l){return l.status==='Pending';});
  var pendHtml='';
  if(pending.length){
    pending.forEach(function(l){
      var u=usr(l.agent);
      pendHtml+='<div style="padding:8px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px">'
        +avH(l.agent)+'<div style="flex:1"><div style="font-size:12px;font-weight:500">'+u.name+'</div>'
        +'<div style="font-size:11px;color:var(--t2)">'+l.type+' · '+l.from+' to '+l.to+' · '+l.days+'d</div></div>'
        +'<button class="btn bsm" style="background:#dcfce7;color:#166534;border-color:#86efac" onclick="leaves.find(function(x){return x.id==='+l.id+'}).status=\'Approved\';renderLeave()"><i class="ti ti-check"></i></button>'
        +'<button class="btn bsm" style="color:#991b1b;border-color:#fca5a5" onclick="leaves.find(function(x){return x.id==='+l.id+'}).status=\'Declined\';renderLeave()"><i class="ti ti-x"></i></button>'
        +'</div>';
    });
    pendHtml='<div class="cd" style="margin-bottom:12px"><div class="ch"><span class="cht" style="color:var(--am)">Pending ('+pending.length+')</span></div>'+pendHtml+'</div>';
  }
  var upcomingRows='';
  leaves.filter(function(l){return l.from>=todayStr;}).sort(function(a,b){return a.from.localeCompare(b.from);}).slice(0,8).forEach(function(l){
    var u=usr(l.agent);
    upcomingRows+='<div style="padding:8px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px">'
      +avH(l.agent)+'<div style="flex:1"><div style="font-size:12px;font-weight:500">'+u.name+' <span style="font-size:10px;color:var(--t3)">('+u.region+')</span></div>'
      +'<div style="font-size:11px;color:var(--t2)">'+l.from+' to '+l.to+' · '+l.days+'d</div></div>'
      +'<span class="bdg" style="background:'+(LV_BG[l.type]||'#f3f4f6')+';color:'+(LV_COLORS[l.type]||'#374151')+'">'+l.type+'</span>'
      +'<span class="bdg '+(l.status==='Approved'?'dg':'da')+'">'+l.status+'</span>'
      +'<button class="btn bsm" onclick="openLv('+l.id+')"><i class="ti ti-pencil"></i></button>'
      +'</div>';
  });
  if(!upcomingRows) upcomingRows='<div class="emp">No upcoming leave</div>';
  document.getElementById('s-leave').innerHTML=
    '<div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start">'
    +'<div class="cd"><div class="ch"><span class="cht">'+monthName+' '+year+'</span>'
    +'<div style="display:flex;gap:6px">'
    +'<button class="btn bsm" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderLeave()"><i class="ti ti-chevron-left"></i></button>'
    +'<button class="btn bsm" onclick="calMonth=new Date().getMonth();calYear=new Date().getFullYear();renderLeave()">Today</button>'
    +'<button class="btn bsm" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderLeave()"><i class="ti ti-chevron-right"></i></button>'
    +'</div></div>'
    +'<div style="padding:10px 14px">'
    +'<div class="cal-grid">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="cal-hdr">'+d+'</div>';}).join('')+calCells+'</div>'
    +'<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+legendHtml+'</div>'
    +'</div></div>'
    +'<div>'+pendHtml
    +'<div class="cd"><div class="ch"><span class="cht">Upcoming leave</span></div>'+upcomingRows+'</div>'
    +'</div></div>';
}
function openLv(id){
  editingLvId=id;
  refreshDd();
  if(id===null){
    document.getElementById('lv-notes').value='';
    document.getElementById('lv-from').value=today();
    document.getElementById('lv-to').value=today();
    document.getElementById('lv-type').value='Annual';
    document.getElementById('m-leave-title').innerHTML='Add leave<button class="cx" onclick="closeMo(\'m-leave\')">x</button>';
    document.getElementById('lv-del-btn').style.display='none';
  } else {
    var l=leaves.find(function(x){return x.id===id;});if(!l)return;
    document.getElementById('lv-agent').value=l.agent;
    document.getElementById('lv-type').value=l.type;
    document.getElementById('lv-from').value=l.from;
    document.getElementById('lv-to').value=l.to;
    document.getElementById('lv-notes').value=l.notes||'';
    document.getElementById('m-leave-title').innerHTML='Edit leave<button class="cx" onclick="closeMo(\'m-leave\')">x</button>';
    document.getElementById('lv-del-btn').style.display='';
  }
  openMo('m-leave');
}
function saveLv(){
  var agent=parseInt(document.getElementById('lv-agent').value);
  var from=document.getElementById('lv-from').value;
  var to=document.getElementById('lv-to').value;
  if(!from||!to)return;
  var days=Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)+1);
  var data={agent:agent,type:document.getElementById('lv-type').value,from:from,to:to,days:days,notes:document.getElementById('lv-notes').value,status:'Pending'};
  if(editingLvId===null){leaves.push(Object.assign({id:nextLvId++},data));}
  else{var l=leaves.find(function(x){return x.id===editingLvId;});if(l)Object.assign(l,Object.assign({},data,{status:l.status}));}
  closeMo('m-leave');renderLeave();
}
function deleteLv(){
  if(!confirm('Delete?'))return;
  leaves=leaves.filter(function(x){return x.id!==editingLvId;});
  closeMo('m-leave');renderLeave();
}

// ═══ TRAINING ═══
function renderTraining(){
  var sorted=trainings.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
  var tableRows='';
  sorted.forEach(function(t){
    var u=usr(t.agent);
    tableRows+='<tr>'
      +'<td><div style="display:flex;align-items:center;gap:5px">'+avH(t.agent)+u.name.split(' ')[0]+'</div></td>'
      +'<td style="font-weight:500">'+t.topic+'</td>'
      +'<td style="white-space:nowrap">'+t.date+'</td>'
      +'<td style="color:var(--t2)">'+t.dur+'</td>'
      +'<td>'+(t.status==='done'?'<span class="bdg dg">Completed</span>':'<span class="bdg dgr">Planned</span>')+'</td>'
      +'<td style="font-size:11px;color:var(--t2)">'+(t.notes||'—')+'</td>'
      +'<td><button class="btn bsm" onclick="openTr('+t.id+')"><i class="ti ti-pencil"></i></button></td>'
      +'</tr>';
  });
  var byAgentHtml='';
  CS_TEAM.forEach(function(u){
    var items=trainings.filter(function(t){return t.agent===u.id;}).sort(function(a,b){return a.date.localeCompare(b.date);});
    if(!items.length) return;
    var doneCt=items.filter(function(t){return t.status==='done';}).length;
    var dotRows='';
    items.forEach(function(t){
      dotRows+='<div style="display:flex;gap:8px;padding:3px 0;align-items:flex-start">'
        +'<div style="width:10px;height:10px;border-radius:50%;background:'+(t.status==='done'?'#16a34a':'#3b82f6')+';flex-shrink:0;margin-top:3px"></div>'
        +'<div><div style="font-size:11px;font-weight:500">'+t.topic+'</div>'
        +'<div style="font-size:10px;color:var(--t2)">'+t.date+' · '+t.dur+(t.notes?' · '+t.notes:'')+'</div></div>'
        +'</div>';
    });
    byAgentHtml+='<div style="padding:10px 14px;border-bottom:1px solid var(--bdr)">'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'+avH(u.id)
      +'<strong style="font-size:12px">'+u.name+'</strong>'
      +'<span class="bdg" style="font-size:10px;background:'+(REGION_C[u.region]||'#e0e7ff')+'22;color:'+(REGION_C[u.region]||'#6366f1')+'">'+u.region+'</span>'
      +'<span style="font-size:11px;color:var(--t2);margin-left:auto">'+doneCt+'/'+items.length+' done</span></div>'
      +dotRows+'</div>';
  });
  document.getElementById('s-training').innerHTML=
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start">'
    +'<div class="cd"><div class="ch"><span class="cht">All sessions — '+trainings.length+'</span></div>'
    +'<table><thead><tr><th>Agent</th><th>Skill / Topic</th><th>Date</th><th>Duration</th><th>Status</th><th>Notes</th><th></th></tr></thead>'
    +'<tbody>'+tableRows+'</tbody></table></div>'
    +'<div class="cd"><div class="ch"><span class="cht">By team member</span></div>'+(byAgentHtml||'<div class="emp">No training scheduled</div>')+'</div>'
    +'</div>';
}
function openTr(id){
  editingTrId=id;
  refreshDd();
  if(id===null){
    ['tr-topic','tr-dur','tr-notes'].forEach(function(x){document.getElementById(x).value='';});
    document.getElementById('tr-date').value=today();
    document.getElementById('tr-status').value='planned';
    document.getElementById('m-train-title').innerHTML='Add training<button class="cx" onclick="closeMo(\'m-train\')">x</button>';
    document.getElementById('tr-del-btn').style.display='none';
  } else {
    var t=trainings.find(function(x){return x.id===id;});if(!t)return;
    document.getElementById('tr-agent').value=t.agent;
    document.getElementById('tr-topic').value=t.topic;
    document.getElementById('tr-date').value=t.date;
    document.getElementById('tr-dur').value=t.dur;
    document.getElementById('tr-status').value=t.status;
    document.getElementById('tr-notes').value=t.notes||'';
    document.getElementById('m-train-title').innerHTML='Edit training<button class="cx" onclick="closeMo(\'m-train\')">x</button>';
    document.getElementById('tr-del-btn').style.display='';
  }
  openMo('m-train');
}
function saveTr(){
  var topic=document.getElementById('tr-topic').value.trim();if(!topic)return;
  var data={agent:parseInt(document.getElementById('tr-agent').value),topic:topic,date:document.getElementById('tr-date').value,dur:document.getElementById('tr-dur').value,status:document.getElementById('tr-status').value,notes:document.getElementById('tr-notes').value};
  if(editingTrId===null){trainings.push(Object.assign({id:nextTrId++},data));}
  else{var t=trainings.find(function(x){return x.id===editingTrId;});if(t)Object.assign(t,data);}
  closeMo('m-train');renderTraining();
}
function deleteTr(){
  if(!confirm('Delete?'))return;
  trainings=trainings.filter(function(x){return x.id!==editingTrId;});
  closeMo('m-train');renderTraining();
}

// ═══ PERFORMANCE ═══
function renderPerf(){
  var excCt=perf.filter(function(p){return p.rating==='Exceeds';}).length;
  var metCt=perf.filter(function(p){return p.rating==='Meets';}).length;
  var devCt=perf.filter(function(p){return p.rating==='Developing';}).length;
  var cards='';
  perf.forEach(function(p){
    var u=usr(p.agent);
    var avg=((p.quality+p.speed+p.attendance+p.teamwork)/4).toFixed(1);
    var bars=[['Quality',p.quality,'#0891b2'],['Speed',p.speed,'#7c3aed'],['Attendance',p.attendance,'#16a34a'],['Teamwork',p.teamwork,'#d97706']];
    var barHtml='';
    bars.forEach(function(b){
      barHtml+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
        +'<span style="font-size:11px;color:var(--t2);width:72px">'+b[0]+'</span>'
        +'<div class="perf-bar"><div class="perf-fill" style="width:'+(b[1]/5*100)+'%;background:'+b[2]+'"></div></div>'
        +'<span style="font-size:11px;font-weight:600;color:'+b[2]+';width:28px;text-align:right">'+b[1]+'</span>'
        +'</div>';
    });
    cards+='<div class="cd">'
      +'<div class="ch" style="padding:10px 14px">'
      +'<div style="display:flex;align-items:center;gap:8px;flex:1">'+avH(p.agent,28)
      +'<div><div style="font-size:12px;font-weight:600">'+u.name+'</div>'
      +'<div style="font-size:10px;color:var(--t2)">'+(u.role==='manager'?'Team Lead':'CSR')+' · '+(u.region||'CS')+'</div></div></div>'
      +'<div><span class="bdg" style="background:'+ratingBg(p.rating)+';color:'+ratingColor(p.rating)+'">'+p.rating+'</span>'
      +'<div style="font-size:12px;font-weight:700;text-align:right;margin-top:2px">'+avg+'/5.0</div></div>'
      +'</div>'
      +'<div style="padding:10px 14px">'+barHtml
      +'<div style="font-size:11px;color:var(--t2);margin-top:6px;font-style:italic;border-top:1px solid var(--bdr);padding-top:6px">'+p.h1+'</div>'
      +'</div></div>';
  });
  document.getElementById('s-perf').innerHTML=
    '<div class="sts" style="grid-template-columns:repeat(3,1fr)">'
    +'<div class="st"><div class="sl">Exceeds expectations</div><div class="sv" style="color:#16a34a">'+excCt+'</div></div>'
    +'<div class="st"><div class="sl">Meets expectations</div><div class="sv" style="color:#1d4ed8">'+metCt+'</div></div>'
    +'<div class="st"><div class="sl">Developing</div><div class="sv" style="color:#d97706">'+devCt+'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+cards+'</div>';
}

// ═══ MODALS ═══
function openMo(id){document.getElementById(id).classList.add('open');}
function closeMo(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.ov').forEach(function(o){o.addEventListener('click',function(e){if(e.target===o)o.classList.remove('open');});});

</script>
